name: Frontend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**"]
    paths:
      - "PRODUCTO/FRONTEND/somosbarrio-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "PRODUCTO/FRONTEND/somosbarrio-frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    name: Vitest (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: PRODUCTO/FRONTEND/somosbarrio-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PRODUCTO/FRONTEND/somosbarrio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
